<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 即時全網比價</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <main class="max-w-6xl mx-auto p-4 sm:p-8 space-y-6">
    <header class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="flex flex-col lg:flex-row lg:items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-bold">🛍️ AI 即時全網比價</h1>
          <p class="text-sm text-slate-500 mt-1">
            使用 Gemini + Google Search 搜尋目前網路上的商品、規格與價格，不限制特定商城。
          </p>
        </div>
        <span id="backendBadge" class="text-xs px-3 py-1.5 rounded-full bg-slate-100 text-slate-500">
          檢查服務中…
        </span>
      </div>
    </header>

    <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div>
        <label class="text-sm font-semibold">商品名稱</label>
        <p class="text-xs text-slate-500 mt-1">
          直接輸入主商品即可，例如「舒潔衛生紙」、「iPhone 18 Pro」、「Sony WH-1000XM6」。
        </p>
      </div>

      <div class="flex flex-col sm:flex-row gap-2">
        <input id="keywordInput"
               class="flex-1 border rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500"
               placeholder="輸入想比價的商品" />
        <button id="searchBtn"
                onclick="runSearch()"
                class="bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white font-semibold px-6 py-3 rounded-xl">
          開始搜尋
        </button>
      </div>

      <div id="status" class="hidden text-sm rounded-xl p-3"></div>
    </section>

    <section id="summarySection"
             class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
      <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold">搜尋摘要</h2>
          <p id="summaryText" class="text-sm text-slate-600 mt-2 leading-6"></p>
        </div>
        <div id="metaText" class="text-xs text-slate-400 whitespace-nowrap"></div>
      </div>
    </section>

    <section id="filterSection"
             class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-5">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold">規格篩選</h2>
          <p class="text-xs text-slate-500 mt-1">
            規格會依商品類型自動產生，例如容量、顏色、層數、抽數、包數、尺寸。
          </p>
        </div>
        <button onclick="clearFilters()"
                class="text-xs border px-3 py-1.5 rounded-lg hover:bg-slate-50">
          清除篩選
        </button>
      </div>
      <div id="filters" class="space-y-4"></div>
    </section>

    <section id="resultSection"
             class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold">比價結果</h2>
          <p id="resultSummary" class="text-xs text-slate-500 mt-1"></p>
        </div>
        <span class="text-xs px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
          僅顯示有 Google Search 來源的價格
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead class="bg-slate-50 border-y">
            <tr>
              <th class="text-left px-4 py-3">賣場</th>
              <th class="text-left px-4 py-3">商品</th>
              <th class="text-left px-4 py-3">規格</th>
              <th class="text-left px-4 py-3">價格</th>
              <th class="text-left px-4 py-3">單位價格</th>
              <th class="text-center px-4 py-3">來源</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
    </section>

    <section id="sourcesSection"
             class="hidden bg-white rounded-2xl border border-slate-200 shadow-sm p-6 space-y-4">
      <div>
        <h2 class="text-lg font-bold">Google Search 搜尋來源</h2>
        <p class="text-xs text-slate-500 mt-1">
          下列網址是本次 Gemini 搜尋實際取得的網頁來源。
        </p>
      </div>

      <div id="searchQueries" class="flex flex-wrap gap-2"></div>
      <div id="sourceList" class="grid md:grid-cols-2 gap-2"></div>
    </section>
  </main>

<script>
  const API_BASE_URL = "https://shopping-compare-api.jimmy-shopping.workers.dev";

  let allItems = [];
  let dimensions = [];
  let selected = {};
  let lastData = null;

  window.addEventListener("load", () => {
    document.getElementById("keywordInput").addEventListener("keydown", event => {
      if (event.key === "Enter") runSearch();
    });
    checkHealth();
  });

  async function checkHealth() {
    const badge = document.getElementById("backendBadge");

    try {
      const response = await fetch(API_BASE_URL + "/api/health", { cache: "no-store" });
      const data = await response.json();

      if (response.ok && data.ok && data.gemini) {
        badge.textContent = "Google Search 比價服務正常";
        badge.className =
          "text-xs px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200";
      } else {
        badge.textContent = "後端未設定 Gemini";
        badge.className =
          "text-xs px-3 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200";
      }
    } catch {
      badge.textContent = "尚未連接後端";
      badge.className =
        "text-xs px-3 py-1.5 rounded-full bg-rose-50 text-rose-700 border border-rose-200";
    }
  }

  async function runSearch() {
    const keyword = document.getElementById("keywordInput").value.trim();
    if (!keyword) return showStatus("請先輸入商品名稱。", "warn");

    const button = document.getElementById("searchBtn");
    button.disabled = true;
    button.textContent = "搜尋中…";

    hideResults();
    showStatus(
      "Gemini 正在使用 Google Search 搜尋目前的網路商品與價格，通常需要數秒。",
      "info"
    );

    const startedAt = performance.now();

    try {
      const response = await fetch(API_BASE_URL + "/api/search", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keyword })
      });

      const responseText = await response.text();
      let data;

      try {
        data = JSON.parse(responseText);
      } catch {
        throw new Error(
          responseText.trim().startsWith("<")
            ? "Cloudflare Worker 尚未就緒，請稍候後再試"
            : "後端回傳格式異常"
        );
      }

      if (!response.ok) {
        throw new Error(data.error || `搜尋失敗（HTTP ${response.status}）`);
      }

      const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);

      lastData = data;
      allItems = Array.isArray(data.products)
        ? data.products
        : Array.isArray(data.items)
          ? data.items
          : [];
      dimensions = Array.isArray(data.dimensions) ? data.dimensions : [];
      selected = {};

      renderSummary(data, seconds);
      renderFilters();
      renderResults();
      renderSources(data);

      document.getElementById("summarySection").classList.remove("hidden");
      document.getElementById("sourcesSection").classList.remove("hidden");

      if (!allItems.length) {
        document.getElementById("filterSection").classList.add("hidden");
        document.getElementById("resultSection").classList.add("hidden");

        showStatus(
          data.source_count
            ? "Google Search 有找到相關來源，但沒有找到同時具備可驗證商品名稱、價格與來源網址的商品。"
            : "這次 Google Search 沒有找到可驗證的商品價格。",
          "warn"
        );
        return;
      }

      document.getElementById("filterSection").classList.toggle(
        "hidden",
        dimensions.length === 0
      );
      document.getElementById("resultSection").classList.remove("hidden");

      showStatus(
        `找到 ${allItems.length} 筆有來源的商品價格，搜尋耗時約 ${seconds} 秒${data.cache_hit ? "（快取）" : ""}。`,
        "ok"
      );
    } catch (error) {
      hideResults();
      showStatus("搜尋失敗：" + error.message, "error");
    } finally {
      button.disabled = false;
      button.textContent = "開始搜尋";
    }
  }

  function renderSummary(data, seconds) {
    document.getElementById("summaryText").textContent =
      data.summary || "已依 Google Search 搜尋結果整理目前可驗證的商品與價格。";

    document.getElementById("metaText").textContent =
      `${data.model || "Gemini"} · ${data.source_count || 0} 個來源 · ${seconds} 秒`;
  }

  function renderFilters() {
    const box = document.getElementById("filters");

    box.innerHTML = dimensions.map(dim => {
      const buttons = (dim.values || []).map(value => {
        const active = selected[dim.key] === value;
        return `
          <button onclick='toggleFilter(${JSON.stringify(dim.key)}, ${JSON.stringify(value)})'
                  class="px-3 py-2 rounded-lg text-sm border transition
                    ${active
                      ? "bg-blue-600 text-white border-blue-600"
                      : "bg-white hover:bg-slate-50"}">
            ${escapeHtml(value)}
          </button>
        `;
      }).join("");

      return `
        <div>
          <div class="text-sm font-semibold mb-2">${escapeHtml(dim.label)}</div>
          <div class="flex flex-wrap gap-2">${buttons}</div>
        </div>
      `;
    }).join("");
  }

  function toggleFilter(key, value) {
    if (selected[key] === value) {
      delete selected[key];
    } else {
      selected[key] = value;
    }

    renderFilters();
    renderResults();
  }

  function clearFilters() {
    selected = {};
    renderFilters();
    renderResults();
  }

  function filteredItems() {
    return allItems.filter(item => {
      return Object.entries(selected).every(([key, value]) => {
        return item.specs && item.specs[key] === value;
      });
    });
  }

  function renderResults() {
    const items = filteredItems()
      .slice()
      .sort((a, b) => Number(a.price) - Number(b.price));

    const body = document.getElementById("resultBody");
    const summary = document.getElementById("resultSummary");

    if (Object.keys(selected).length) {
      summary.textContent =
        `目前篩選：${Object.entries(selected)
          .map(([key, value]) => key + " " + value)
          .join(" / ")}，共 ${items.length} 筆`;
    } else {
      summary.textContent = `尚未選擇規格，共 ${items.length} 筆`;
    }

    if (!items.length) {
      body.innerHTML =
        '<tr><td colspan="6" class="text-center py-10 text-slate-500">目前沒有符合這組規格的商品。</td></tr>';
      return;
    }

    const minPrice = Math.min(
      ...items.map(item => Number(item.price)).filter(Number.isFinite)
    );

    body.innerHTML = items.map(item => {
      const lowest = Number(item.price) === minPrice;

      const specs = Object.entries(item.specs || {})
        .map(([key, value]) =>
          `<span class="inline-block mr-1 mb-1 bg-slate-100 px-2 py-1 rounded-md text-xs">
             <b>${escapeHtml(key)}</b> ${escapeHtml(value)}
           </span>`
        )
        .join("");

      return `
        <tr class="border-b hover:bg-slate-50 ${lowest ? "bg-emerald-50/40" : ""}">
          <td class="px-4 py-4 whitespace-nowrap font-medium">
            ${escapeHtml(item.store_name || item.store)}
          </td>

          <td class="px-4 py-4 min-w-[280px]">
            <div class="font-medium">${escapeHtml(item.title)}</div>
            <div class="text-xs text-slate-400 mt-1">
              ${escapeHtml(item.source_title || "")}
            </div>
          </td>

          <td class="px-4 py-4 min-w-[220px]">
            ${specs || '<span class="text-xs text-slate-400">未解析到額外規格</span>'}
          </td>

          <td class="px-4 py-4 whitespace-nowrap">
            <div class="font-bold ${lowest ? "text-emerald-600 text-lg" : ""}">
              NT$ ${Number(item.price).toLocaleString()}
            </div>
            ${lowest
              ? '<span class="inline-block mt-1 text-[10px] bg-emerald-600 text-white px-2 py-0.5 rounded-full">目前結果最低價</span>'
              : ""}
          </td>

          <td class="px-4 py-4 min-w-[120px] text-xs text-slate-600">
            ${escapeHtml(item.unit_price_text || "-")}
          </td>

          <td class="px-4 py-4 text-center">
            <a href="${escapeAttr(item.source_url || item.url)}"
               target="_blank"
               rel="noopener noreferrer"
               class="inline-block text-xs font-semibold text-blue-600 border border-blue-200 bg-blue-50 hover:bg-blue-600 hover:text-white px-3 py-2 rounded-lg">
              查看來源 ↗
            </a>
          </td>
        </tr>
      `;
    }).join("");
  }

  function renderSources(data) {
    const queries = Array.isArray(data.search_queries) ? data.search_queries : [];
    const sources = Array.isArray(data.sources) ? data.sources : [];

    const queryBox = document.getElementById("searchQueries");
    queryBox.innerHTML = queries.length
      ? queries.map(query =>
          `<span class="text-xs bg-slate-100 text-slate-600 px-3 py-1.5 rounded-full">
             搜尋：${escapeHtml(query)}
           </span>`
        ).join("")
      : '<span class="text-xs text-slate-400">未提供搜尋字詞</span>';

    const sourceBox = document.getElementById("sourceList");
    sourceBox.innerHTML = sources.length
      ? sources.slice(0, 30).map(source => `
          <a href="${escapeAttr(source.url)}"
             target="_blank"
             rel="noopener noreferrer"
             class="border rounded-xl p-3 hover:bg-slate-50 transition block">
            <div class="text-sm font-semibold text-blue-700">
              ${escapeHtml(source.title || source.url)}
            </div>
            <div class="text-xs text-slate-400 mt-1 truncate">
              ${escapeHtml(source.url)}
            </div>
            ${source.snippet
              ? `<div class="text-xs text-slate-500 mt-2 line-clamp-2">${escapeHtml(source.snippet)}</div>`
              : ""}
          </a>
        `).join("")
      : '<div class="text-sm text-slate-400">沒有可顯示的 Google Search 來源。</div>';
  }

  function hideResults() {
    allItems = [];
    dimensions = [];
    selected = {};
    lastData = null;

    document.getElementById("summarySection").classList.add("hidden");
    document.getElementById("filterSection").classList.add("hidden");
    document.getElementById("resultSection").classList.add("hidden");
    document.getElementById("sourcesSection").classList.add("hidden");
  }

  function showStatus(message, type) {
    const element = document.getElementById("status");
    const classes = {
      info: "bg-blue-50 text-blue-700 border border-blue-200",
      ok: "bg-emerald-50 text-emerald-700 border border-emerald-200",
      warn: "bg-amber-50 text-amber-700 border border-amber-200",
      error: "bg-rose-50 text-rose-700 border border-rose-200"
    };

    element.className = "text-sm rounded-xl p-3 " + (classes[type] || classes.info);
    element.textContent = message;
  }

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttr(value) {
    return escapeHtml(value);
  }
</script>
</body>
</html>
