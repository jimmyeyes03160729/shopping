<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 跨商城智慧比價系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 sm:p-8">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 標題 -->
    <header class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">🛍️ AI 跨商城規格比價系統</h1>
        <p class="text-sm text-gray-500 mt-1">自訂商城清單 + Gemini 智能規格提取與價格對齊</p>
      </div>
      <!-- API Key 設定區 (存於本地，安全不外洩) -->
      <div class="w-full sm:w-72">
        <label class="block text-xs font-semibold text-gray-600 mb-1">Gemini API Key (存在本機)</label>
        <input id="apiKeyInput" type="password" placeholder="貼上你的 API Key"
          class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </header>

    <!-- 商城管理區 (可新增/刪除) -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">🌐 購物商城清單管理</h2>
        <span class="text-xs text-gray-400">網址請務必包含 {keyword} 佔位符</span>
      </div>

      <!-- 新增商城 -->
      <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
        <input id="storeNameInput" type="text" placeholder="商城名稱 (例: PChome)"
          class="sm:col-span-3 text-sm px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <input id="storeUrlInput" type="text" placeholder="搜尋網址模板 (例: https://ecshweb.pchome.com.tw/search/v3.3/all/results?q={keyword})"
          class="sm:col-span-7 text-sm px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button onclick="addStore()"
          class="sm:col-span-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
          ＋ 新增商城
        </button>
      </div>

      <!-- 商城列表 -->
      <div id="storeList" class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-2"></div>
    </section>

    <!-- 搜尋與比價操作區 -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex gap-2">
        <input id="keywordInput" type="text" placeholder="請輸入想比價的商品關鍵字 (例: iPhone 15 128GB、Sony WH-1000XM5)"
          class="flex-1 px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-base" />
        <button id="compareBtn" onclick="startComparison()"
          class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-3 rounded-xl transition flex items-center gap-2">
          <span>開始比價</span>
        </button>
      </div>
      <div id="statusText" class="text-sm text-gray-500 hidden"></div>
    </section>

    <!-- 比價結果展示區 -->
    <section id="resultSection" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 hidden space-y-4">
      <h2 class="text-lg font-bold text-gray-800">📊 比價結果 (同規格已自動聚合排序)</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 font-semibold text-gray-700">規格群組</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商城</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商品名稱</th>
              <th class="px-4 py-3 font-semibold text-gray-700">價格</th>
              <th class="px-4 py-3 font-semibold text-gray-700">主要規格</th>
              <th class="px-4 py-3 font-semibold text-gray-700">連結</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    // 預設商城配置
    const DEFAULT_STORES = [
      { name: "PChome 24h", template: "https://ecshweb.pchome.com.tw/search/v3.3/all/results?q={keyword}" },
      { name: "Momo 購物網", template: "https://www.momo.com.tw/search/searchShop.jsp?keyword={keyword}" }
    ];

    let stores = JSON.parse(localStorage.getItem("comparator_stores")) || DEFAULT_STORES;

    // 初始化讀取 API Key 與商城清單
    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_api_key") || "";
      document.getElementById("apiKeyInput").value = savedKey;
      renderStores();
    };

    document.getElementById("apiKeyInput").addEventListener("input", (e) => {
      localStorage.setItem("gemini_api_key", e.target.value.trim());
    });

    function saveStores() {
      localStorage.setItem("comparator_stores", JSON.stringify(stores));
      renderStores();
    }

    function renderStores() {
      const container = document.getElementById("storeList");
      container.innerHTML = "";
      stores.forEach((store, index) => {
        const item = document.createElement("div");
        item.className = "flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border border-gray-200 text-sm";
        item.innerHTML = `
          <div class="truncate mr-2">
            <span class="font-semibold text-gray-800">${store.name}</span>
            <span class="text-xs text-gray-400 block truncate">${store.template}</span>
          </div>
          <button onclick="removeStore(${index})" class="text-red-500 hover:text-red-700 text-xs px-2 py-1">刪除</button>
        `;
        container.appendChild(item);
      });
    }

    function addStore() {
      const name = document.getElementById("storeNameInput").value.trim();
      const template = document.getElementById("storeUrlInput").value.trim();
      if (!name || !template || !template.includes("{keyword}")) {
        alert("請確認輸入名稱，且網址模板內包含 {keyword}");
        return;
      }
      stores.push({ name, template });
      saveStores();
      document.getElementById("storeNameInput").value = "";
      document.getElementById("storeUrlInput").value = "";
    }

    function removeStore(index) {
      stores.splice(index, 1);
      saveStores();
    }

    // 調用 Gemini API 進行結構化提取
    async function startComparison() {
      const apiKey = document.getElementById("apiKeyInput").value.trim();
      const keyword = document.getElementById("keywordInput").value.trim();
      const statusText = document.getElementById("statusText");
      const resultSection = document.getElementById("resultSection");
      const resultBody = document.getElementById("resultBody");

      if (!apiKey) {
        alert("請先在右上角輸入 Gemini API Key！");
        return;
      }
      if (!keyword) {
        alert("請輸入商品關鍵字！");
        return;
      }
      if (stores.length === 0) {
        alert("請至少新增一個商城網址！");
        return;
      }

      statusText.classList.remove("hidden");
      statusText.innerText = "⏳ 正在處理中... 準備分析目標網站資料...";
      resultSection.classList.add("hidden");
      resultBody.innerHTML = "";

      const storeLinks = stores.map(s => ({
        store_name: s.name,
        target_url: s.template.replace("{keyword}", encodeURIComponent(keyword))
      }));

      // 提示詞：要求 Gemini 進行規格提取與規格對齊
      const prompt = `
你是一個專業的商品比價與規格分析專家。
使用者要比價的關鍵字是：「${keyword}」。

以下是目標商城的搜尋連結與對應電商：
${JSON.stringify(storeLinks, null, 2)}

任務：
1. 請針對此關鍵字，模擬/分析這幾個商城在該關鍵字下可能會搜尋到的前 1~2 項主力正品商品。
2. 提取出乾淨價格（純數字）。
3. 提取核心規格（如記憶體、儲存空間、尺寸、顏色等）。
4. 最關鍵：給「同款規格」相同的 matched_group_id（例如：iphone-15-128gb），方便進行跨平台同款對齊比價。

請只回傳符合以下 JSON Schema 的格式：
[
  {
    "store_name": "商城名稱",
    "product_name": "標準商品名稱",
    "price": 28900,
    "currency": "TWD",
    "matched_group_id": "規格群組ID",
    "specs": "128GB / 黑色 / A16 晶片",
    "url": "商品或搜尋網址"
  }
]
`;

      try {
        statusText.innerText = "🤖 正在連線 Gemini API 進行規格分析與比價...";
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const replyText = data.candidates[0].content.parts[0].text;
        const products = JSON.parse(replyText);

        // 依群組與價格排序
        products.sort((a, b) => (a.matched_group_id > b.matched_group_id) ? 1 : (a.price - b.price));

        // 渲染表格
        resultBody.innerHTML = products.map(p => `
          <tr class="hover:bg-gray-50 transition">
            <td class="px-4 py-3 font-mono text-xs text-blue-600 font-semibold">${p.matched_group_id}</td>
            <td class="px-4 py-3 font-medium text-gray-900">${p.store_name}</td>
            <td class="px-4 py-3">${p.product_name}</td>
            <td class="px-4 py-3 font-bold text-emerald-600">${p.currency}${p.price.toLocaleString()}</td>
            <td class="px-4 py-3 text-xs text-gray-500">${p.specs || '-'}</td>
            <td class="px-4 py-3 text-xs"><a href="${p.url}" target="_blank" class="text-blue-500 hover:underline">前往</a></td>
          </tr>
        `).join("");

        statusText.classList.add("hidden");
        resultSection.classList.remove("hidden");
      } catch (err) {
        statusText.innerText = `❌ 執行失敗：${err.message}`;
      }
    }
  </script>
</body>
</html>
