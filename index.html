<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的個人 AI 比價系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6 min-h-screen">
  <div class="max-w-4xl mx-auto space-y-6">
    
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
      <h1 class="text-2xl font-bold text-gray-900">🛍️ 個人專屬 AI 比價看板</h1>
      <p class="text-sm text-gray-500 mt-1">API Key 與自動排程由 GitHub 全自動託管，不需手動輸入金鑰</p>
    </header>

    <!-- 官網清單區（只填首頁） -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-3">
      <h2 class="text-lg font-bold text-gray-800">🌐 追蹤的購物官網首頁</h2>
      <div class="flex gap-2">
        <input id="storeUrlInput" type="text" placeholder="直接貼上官網首頁，例如: https://shopee.tw" 
               class="flex-1 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <button onclick="addStore()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition">
          新增首頁
        </button>
      </div>
      <div id="storeList" class="flex flex-wrap gap-2 pt-2"></div>
      <p class="text-xs text-gray-400">提示：修改後的清單會在下次 GitHub 比價時使用。</p>
    </section>

    <!-- 比價結果展示區 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-lg font-bold text-gray-800">📊 最新比價結果</h2>
          <p id="metaInfo" class="text-xs text-gray-400 mt-0.5">載入中...</p>
        </div>
        <button onclick="loadResults()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg">
          🔄 重新載入
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 font-semibold text-gray-700">規格組別</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商城</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商品名稱</th>
              <th class="px-4 py-3 font-semibold text-gray-700">價格</th>
              <th class="px-4 py-3 font-semibold text-gray-700">規格說明</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    let stores = JSON.parse(localStorage.getItem("my_simple_stores")) || [
      "https://shopee.tw",
      "https://24h.pchome.com.tw",
      "https://www.momo.com.tw"
    ];

    window.onload = () => {
      renderStores();
      loadResults();
    };

    function renderStores() {
      const container = document.getElementById("storeList");
      container.innerHTML = stores.map((s, i) => `
        <span class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-xs">
          ${s}
          <button onclick="removeStore(${i})" class="text-red-500 hover:text-red-700 font-bold ml-1">×</button>
        </span>
      `).join("");
      localStorage.setItem("my_simple_stores", JSON.stringify(stores));
    }

    function addStore() {
      const input = document.getElementById("storeUrlInput");
      const val = input.value.trim();
      if (val) {
        stores.push(val.startsWith("http") ? val : "https://" + val);
        input.value = "";
        renderStores();
      }
    }

    function removeStore(index) {
      stores.splice(index, 1);
      renderStores();
    }

    async function loadResults() {
      const meta = document.getElementById("metaInfo");
      const body = document.getElementById("resultBody");
      try {
        const res = await fetch('result.json?t=' + new Date().getTime());
        if (!res.ok) throw new Error("尚未產生比價結果，請先在 GitHub Actions 執行比價。");
        const data = await res.json();
        
        meta.innerText = `搜尋關鍵字：${data.keyword} | 更新時間：${data.updated_at}`;
        
        // 排序：同規格一組，價格由低到高
        data.items.sort((a, b) => a.matched_group_id.localeCompare(b.matched_group_id) || a.price - b.price);
        
        body.innerHTML = data.items.map(p => `
          <tr class="hover:bg-gray-50">
            <td class="px-4 py-3 font-mono text-xs text-blue-600 font-semibold">${p.matched_group_id}</td>
            <td class="px-4 py-3 font-medium text-gray-900">${p.store_name}</td>
            <td class="px-4 py-3">${p.canonical_name}</td>
            <td class="px-4 py-3 font-bold text-emerald-600">NT$ ${p.price.toLocaleString()}</td>
            <td class="px-4 py-3 text-xs text-gray-500">${p.key_specs}</td>
          </tr>
        `).join("");
      } catch (err) {
        meta.innerText = err.message;
        body.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400 text-xs">${err.message}</td></tr>`;
      }
    }
  </script>
</body>
</html>
