<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的個人 AI 比價系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-4 sm:p-8 min-h-screen">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- 頁頭 -->
    <header class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">🛍️ 個人專屬 AI 比價看板</h1>
        <p class="text-sm text-gray-500 mt-1">輸入關鍵字直接比價，自動標記全網最低價與購買連結</p>
      </div>
      <!-- 金鑰設定 (本機儲存，輸入一次後永久記住) -->
      <div id="keyBox" class="w-full sm:w-72">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-semibold text-gray-600">Gemini API Key</label>
          <span id="keyStatus" class="text-[10px] text-gray-400"></span>
        </div>
        <input id="apiKeyInput" type="password" placeholder="貼上你的 API Key (只填一次)"
          class="w-full text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
    </header>

    <!-- 搜尋欄位 -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4">
      <h2 class="text-lg font-bold text-gray-800">🔍 商品關鍵字搜尋</h2>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="keywordInput" type="text" placeholder="輸入關鍵字 (例: iPhone 16 Pro、Sony WH-1000XM5)" 
               class="flex-1 px-4 py-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <button id="compareBtn" onclick="startDirectComparison()" 
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-6 py-2.5 rounded-xl transition flex items-center justify-center gap-2 shadow-sm">
          <span>開始比價</span>
        </button>
      </div>
      <div id="statusText" class="text-xs text-gray-500 font-medium hidden"></div>
    </section>

    <!-- 官網清單管理區 (只填首頁) -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">🌐 追蹤的購物官網首頁</h2>
        <span class="text-xs text-gray-400">只貼官網首頁，自動保存</span>
      </div>
      <div class="flex gap-2">
        <input id="storeUrlInput" type="text" placeholder="貼上官網首頁，例如: https://shopee.tw" 
               class="flex-1 px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none" />
        <button onclick="addStore()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-xl transition">
          新增官網
        </button>
      </div>
      <div id="storeList" class="flex flex-wrap gap-2 pt-2"></div>
    </section>

    <!-- 比價結果展示區 -->
    <section id="resultSection" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 space-y-4 hidden">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-gray-800">📊 比價結果清單</h2>
        <span class="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full font-medium">
          綠色標籤為同規格最低價
        </span>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-left text-sm divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 font-semibold text-gray-700">規格組別</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商城</th>
              <th class="px-4 py-3 font-semibold text-gray-700">商品標題</th>
              <th class="px-4 py-3 font-semibold text-gray-700">價格</th>
              <th class="px-4 py-3 font-semibold text-gray-700">規格說明</th>
              <th class="px-4 py-3 font-semibold text-gray-700 text-center">購買連結</th>
            </tr>
          </thead>
          <tbody id="resultBody" class="divide-y divide-gray-100"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script>
    let stores = JSON.parse(localStorage.getItem("my_simple_stores")) || [
      "https://shopee.tw",
      "https://24h.pchome.com.tw",
      "https://www.momo.com.tw"
    ];

    window.onload = () => {
      const savedKey = localStorage.getItem("gemini_user_api_key") || "";
      if (savedKey) {
        document.getElementById("apiKeyInput").value = savedKey;
        document.getElementById("keyStatus").innerText = "已就緒";
        document.getElementById("keyStatus").className = "text-[10px] text-emerald-600 font-bold";
      }
      renderStores();

      document.getElementById("keywordInput").addEventListener("keypress", (e) => {
        if (e.key === "Enter") startDirectComparison();
      });
    };

    document.getElementById("apiKeyInput").addEventListener("input", (e) => {
      const val = e.target.value.trim();
      localStorage.setItem("gemini_user_api_key", val);
      document.getElementById("keyStatus").innerText = val ? "已就緒" : "";
      document.getElementById("keyStatus").className = "text-[10px] text-emerald-600 font-bold";
    });

    function renderStores() {
      const container = document.getElementById("storeList");
      container.innerHTML = stores.map((s, i) => `
        <span class="inline-flex items-center gap-1.5 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-xs">
          ${s}
          <button onclick="removeStore(${i})" class="text-red-500 hover:text-red-700 font-bold ml-1">×</button>
        </span>
      `).join("");
      localStorage.setItem("my_simple_stores", JSON.stringify(stores));
    }

    function addStore() {
      const input = document.getElementById("storeUrlInput");
      const val = input.value.trim();
      if (val) {
        stores.push(val.startsWith("http") ? val : "https://" + val);
        input.value = "";
        renderStores();
      }
    }

    function removeStore(index) {
      stores.splice(index, 1);
      renderStores();
    }

    async function startDirectComparison() {
      const apiKey = localStorage.getItem("gemini_user_api_key") || document.getElementById("apiKeyInput").value.trim();
      const keyword = document.getElementById("keywordInput").value.trim();
      const statusText = document.getElementById("statusText");
      const resultSection = document.getElementById("resultSection");
      const resultBody = document.getElementById("resultBody");
      const compareBtn = document.getElementById("compareBtn");

      if (!apiKey) {
        alert("請先在右上角貼入一次你的 Gemini API Key！");
        return;
      }
      if (!keyword) {
        alert("請輸入商品關鍵字！");
        return;
      }
      if (stores.length === 0) {
        alert("請至少新增一個官網首頁！");
        return;
      }

      compareBtn.disabled = true;
      compareBtn.innerText = "⏳ 比價中...";
      statusText.classList.remove("hidden");
      statusText.innerText = "🤖 正在連線 Gemini 進行即時規格分析與比價...";
      resultSection.classList.add("hidden");
      resultBody.innerHTML = "";

      const prompt = `
你是一位專業的商品規格分析與比價引擎。
使用者搜尋關鍵字：「${keyword}」。
目標購物官網清單：${JSON.stringify(stores)}

任務：
1. 針對各官網，評估在此關鍵字下對應的主力現貨商品。
2. 提取純數字價格。
3. 提取核心規格參數（如容量、顏色、型號）。
4. 將完全相同規格的商品賦予相同的 matched_group_id。
5. 排除不相關配件。

請只回傳以下格式的 JSON 陣列：
[
  {
    "store_name": "商城名稱",
    "canonical_name": "標準商品名稱",
    "price": 36900,
    "currency": "TWD",
    "matched_group_id": "規格組別ID",
    "key_specs": "128GB / 原色鈦金屬",
    "url": "https://shopee.tw/search?keyword=..."
  }
]
`;

      try {
        // 已更新為 gemini-3.6-flash
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: {
              response_mime_type: "application/json"
            }
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const items = JSON.parse(data.candidates[0].content.parts[0].text);
        if (!Array.isArray(items) || items.length === 0) {
          statusText.innerText = "ℹ️ 未能找到相關規格商品。";
          return;
        }

        const minPriceMap = {};
        items.forEach(p => {
          if (!minPriceMap[p.matched_group_id] || p.price < minPriceMap[p.matched_group_id]) {
            minPriceMap[p.matched_group_id] = p.price;
          }
        });

        items.sort((a, b) => a.matched_group_id.localeCompare(b.matched_group_id) || a.price - b.price);

        resultBody.innerHTML = items.map(p => {
          const isLowest = p.price === minPriceMap[p.matched_group_id];
          const targetUrl = p.url && p.url.startsWith("http") ? p.url : `https://www.google.com/search?q=${encodeURIComponent(p.store_name + ' ' + p.canonical_name)}`;
          return `
            <tr class="hover:bg-gray-50 transition ${isLowest ? 'bg-emerald-50/40' : ''}">
              <td class="px-4 py-3 font-mono text-xs text-blue-600 font-semibold">${escapeHtml(p.matched_group_id)}</td>
              <td class="px-4 py-3 font-medium text-gray-900">${escapeHtml(p.store_name)}</td>
              <td class="px-4 py-3 font-medium text-gray-800">${escapeHtml(p.canonical_name)}</td>
              <td class="px-4 py-3 whitespace-nowrap">
                <span class="font-bold ${isLowest ? 'text-emerald-600 text-base' : 'text-gray-800'}">
                  NT$ ${Number(p.price).toLocaleString()}
                </span>
                ${isLowest ? '<span class="ml-1.5 inline-block bg-emerald-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm">最低價</span>' : ''}
              </td>
              <td class="px-4 py-3 text-xs text-gray-500">${escapeHtml(p.key_specs || '-')}</td>
              <td class="px-4 py-3 text-center whitespace-nowrap">
                <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" 
                   class="inline-block bg-blue-50 hover:bg-blue-600 hover:text-white text-blue-600 border border-blue-200 text-xs font-semibold px-3 py-1.5 rounded-lg transition">
                  前往購買 ↗
                </a>
              </td>
            </tr>
          `;
        }).join("");

        statusText.classList.add("hidden");
        resultSection.classList.remove("hidden");
      } catch (err) {
        statusText.innerText = `❌ 查詢失敗：${err.message}`;
      } finally {
        compareBtn.disabled = false;
        compareBtn.innerText = "開始比價";
      }
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
