name: Run Price Comparison

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: '欲搜尋的商品關鍵字'
        required: true
        default: 'iPhone 15 128G'

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install google-genai pydantic httpx beautifulsoup4

      - name: Run AI Compare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          KEYWORD: ${{ github.event.inputs.keyword }}
        run: |
          python - << 'EOF'
          import os, json
          from comparator import run_price_comparison

          keyword = os.environ.get("KEYWORD", "iPhone 15 128G")
          with open("stores.json", "r", encoding="utf-8") as f:
              stores = json.load(f)

          items = run_price_comparison(keyword, stores)
          results = [item.model_dump() for item in items if item.is_target_match]
          
          payload = {
              "keyword": keyword,
              "updated_at": os.popen('date "+%Y-%m-%d %H:%M:%S"').read().strip(),
              "items": results
          }
          
          with open("result.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit & Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add result.json stores.json
          git commit -m "Update comparison result for ${{ github.event.inputs.keyword }}" || echo "No changes to commit"
          git push
